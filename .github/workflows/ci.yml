name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Model quality guards
        run: python test_model.py

      - name: Full pipeline
        run: python train.py

      - name: Every plot was produced
        run: |
          python - <<'PY'
          import pathlib
          import matplotlib.image as mpimg

          expected = [
              "01_correlation_heatmap.png",
              "02_confusion_matrix.png",
              "03_feature_importance.png",
              "04_model_comparison.png",
          ]

          failed = False
          for name in expected:
              path = pathlib.Path(name)
              if not path.exists():
                  print(f"missing {name}")
                  failed = True
                  continue
              # Read the pixels, so a zero-byte or truncated file fails here
              # rather than looking like a valid image to a size check.
              image = mpimg.imread(path)
              print(f"{name}: {image.shape}")
              if image.size == 0:
                  print(f"  {name} decoded to nothing")
                  failed = True

          raise SystemExit(1 if failed else 0)
          PY
